name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for prerendering
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Prerender all routes
        run: npm run prerender
      - name: Verify published files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const posts = JSON.parse(fs.readFileSync('public/posts/index.json', 'utf8'));
          for (const route of ['', 'blog', ...posts.map(p => 'blog/' + p.slug)]) {
            const html = fs.readFileSync('build/' + (route ? route + '/' : '') + 'index.html', 'utf8');
            assert(html.includes('window.__PRERENDER__='), 'Missing prerender data: ' + route);
          }
          for (const post of posts) {
            const file = 'posts/' + post.slug + '.md';
            assert.deepEqual(fs.readFileSync('build/' + file), fs.readFileSync('public/' + file));
          }
          assert(fs.existsSync('build/.nojekyll'));
          assert(fs.existsSync('build/404.html'));
          NODE
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
